# Tax Knowledge Curator — Ingestion Sources
#
# Each entry defines one authoritative source to crawl.
# Fields:
#   name           - human-readable label (used in digest reports)
#   jurisdiction   - 'US', 'SC', 'GA', 'DE', etc.  Federal = 'US'.
#   topic          - slug matching the `topic` column in tax_knowledge_document
#                    (must be consistent across runs for dedup to work)
#   tax_year       - integer or null for evergreen rules
#   base_url       - the page to fetch
#   refresh_days   - minimum days between re-fetches (curator skips if last
#                    ingestion was less than this many days ago AND digest unchanged)
#   crawl_hint     - optional human note about what to extract from the page
#   paywalled      - set to true to SKIP (curator logs but never ingests these)
#
# To add a new source: append to this file and re-run make knowledge-refresh.
# The curator will ingest it on the next run.
#
# Jurisdiction codes:
#   US    = IRS / federal
#   SC    = South Carolina DOR
#   GA    = Georgia DOR (future)
#   DE    = Delaware Division of Revenue (future)
#   CFR   = Code of Federal Regulations (title 26)

sources:

  # -----------------------------------------------------------------------
  # IRS — Form 1120 (federal corporate return)
  # -----------------------------------------------------------------------
  - name: "IRS Form 1120 instructions"
    jurisdiction: US
    topic: form_1120
    tax_year: null
    base_url: https://www.irs.gov/forms-pubs/about-form-1120
    refresh_days: 30
    crawl_hint: >
      Extract the main instructions text from the about-form page.
      Follow the 'Instructions for Form 1120' PDF link if present and
      extract the line-by-line instructions section.

  - name: "IRS Form 1120 line-by-line instructions (2024)"
    jurisdiction: US
    topic: form_1120_instructions_2024
    tax_year: 2024
    base_url: https://www.irs.gov/pub/irs-pdf/i1120.pdf
    refresh_days: 90
    crawl_hint: >
      PDF — extract text content. Focus on line descriptions, amounts,
      and statutory references. Skip cover page boilerplate.

  # -----------------------------------------------------------------------
  # IRS — 1099-NEC / 1099-MISC
  # -----------------------------------------------------------------------
  - name: "IRS 1099-NEC about page"
    jurisdiction: US
    topic: 1099_NEC
    tax_year: null
    base_url: https://www.irs.gov/forms-pubs/about-form-1099-nec
    refresh_days: 30
    crawl_hint: >
      Extract the rules summary, threshold amounts, and due dates.
      Note any IRS Notices referenced (especially threshold phase-in
      notices for 1099-K transition).

  - name: "IRS 1099-NEC + 1099-MISC instructions (2024)"
    jurisdiction: US
    topic: 1099_NEC_instructions_2024
    tax_year: 2024
    base_url: https://www.irs.gov/pub/irs-pdf/i1099mec.pdf
    refresh_days: 90
    crawl_hint: >
      PDF — extract payee type rules, exceptions (corporations, payments
      via credit card, etc.), threshold amounts ($600), and due dates.

  - name: "IRS Notice 2024-85 — 1099-K threshold"
    jurisdiction: US
    topic: 1099_K_threshold
    tax_year: 2024
    base_url: https://www.irs.gov/pub/irs-drop/n-24-85.pdf
    refresh_days: 180
    crawl_hint: >
      IRS Notice confirming the 1099-K reporting threshold transition
      ($5,000 for 2024, $2,500 for 2025, $600 for 2026+).

  # -----------------------------------------------------------------------
  # IRS — §174 R&D Capitalization (TCJA)
  # -----------------------------------------------------------------------
  - name: "IRS §174 R&D capitalization FAQ"
    jurisdiction: US
    topic: "174"
    tax_year: null
    # rotated 2026-05-29: old URL
    # https://www.irs.gov/newsroom/frequently-asked-questions-changes-to-the-research-and-experimental-expenditures-credit
    # 404 after IRS site reorganization; the Research Credit page is the closest
    # canonical successor and now incorporates §174/§174A guidance post-OBBBA.
    base_url: https://www.irs.gov/businesses/research-credit
    refresh_days: 30
    crawl_hint: >
      Extract Q&A text covering the post-2022 mandatory capitalization
      requirement for §174 R&E expenditures. Note any pending legislative
      changes (OBBBA provisions restoring immediate expensing via §174A
      for tax years beginning after 2024).

  - name: "IRS Rev. Proc. 2024-9 — §174 safe harbor"
    jurisdiction: US
    topic: "174_safe_harbor"
    tax_year: 2024
    base_url: https://www.irs.gov/pub/irs-drop/rp-24-09.pdf
    refresh_days: 180
    crawl_hint: >
      Revenue Procedure providing a safe harbor for §174 R&E
      expenditure determination.

  # -----------------------------------------------------------------------
  # IRS — §163(j) Business Interest Limitation
  # -----------------------------------------------------------------------
  - name: "IRS §163(j) business interest limitation — about page"
    jurisdiction: US
    topic: "163j"
    tax_year: null
    # rotated 2026-05-29: old URL
    # https://www.irs.gov/newsroom/tax-cuts-and-jobs-act-provision-11-business-interest
    # 404 after IRS retired the per-provision TCJA pages; the Q&A page is the
    # current canonical IRS §163(j) explainer.
    base_url: https://www.irs.gov/newsroom/questions-and-answers-about-the-limitation-on-the-deduction-for-business-interest-expense
    refresh_days: 60
    crawl_hint: >
      Extract the small business exemption threshold (currently $30M average
      annual gross receipts), ATI computation rules, and any OBBBA
      modifications restoring the pre-2022 EBITDA-based ATI.

  # -----------------------------------------------------------------------
  # IRS — Bonus Depreciation (§168(k))
  # -----------------------------------------------------------------------
  - name: "IRS bonus depreciation — about page"
    jurisdiction: US
    topic: bonus_depreciation
    tax_year: null
    # rotated 2026-05-29: old URL
    # https://www.irs.gov/newsroom/tax-cuts-and-jobs-act-provision-13-new-100-percent-depreciation-deduction-for-businesses
    # 404 after IRS retired the per-provision TCJA pages; the bonus FAQ page
    # is the current canonical successor.
    base_url: https://www.irs.gov/newsroom/additional-first-year-depreciation-deduction-bonus-faq
    refresh_days: 60
    crawl_hint: >
      Track the phase-down schedule: 100% (2018–2022), 80% (2023),
      60% (2024), 40% (2025), 20% (2026), 0% (2027+).
      Note OBBBA / P.L. 119-21 provisions restoring 100% for property
      acquired and placed in service after January 19, 2025.

  - name: "IRS Publication 946 — How To Depreciate Property"
    jurisdiction: US
    topic: depreciation_pub946
    tax_year: null
    base_url: https://www.irs.gov/pub/irs-pdf/p946.pdf
    refresh_days: 180
    crawl_hint: >
      PDF — extract bonus depreciation rules, §179 limits, MACRS tables.
      Focus on Chapter 4 (§179 deduction) and Chapter 3 (bonus depreciation).

  # -----------------------------------------------------------------------
  # TCJA / OBBBA tracking
  # -----------------------------------------------------------------------
  - name: "OBBBA — One Big Beautiful Bill Act (HR 1)"
    jurisdiction: US
    topic: tcja_obbba_tracker
    tax_year: null
    # rotated 2026-05-29: old URL
    # https://www.congress.gov/bill/119th-congress/house-bill/1
    # congress.gov bill landing pages now block non-browser HTTP clients (403).
    # OBBBA was enacted as P.L. 119-21 on 2025-07-04, so the IRS provisions
    # page is the better authoritative tracker going forward. Source authority
    # accordingly shifts from Congress to IRS.
    base_url: https://www.irs.gov/newsroom/one-big-beautiful-bill-provisions
    refresh_days: 14
    crawl_hint: >
      Extract IRS summary of OBBBA tax provisions as implemented:
      §174A domestic R&E expensing restoration, §163(j) ATI add-backs,
      100% bonus depreciation restoration, §199A treatment, and SALT
      cap changes.

  - name: "IRS TCJA overview"
    jurisdiction: US
    topic: tcja_overview
    tax_year: null
    # rotated 2026-05-29: old URL
    # https://www.irs.gov/newsroom/tax-cuts-and-jobs-act-tcja-overview
    # 404 after IRS consolidated TCJA content under a single landing page.
    base_url: https://www.irs.gov/tax-cuts-and-jobs-act
    refresh_days: 60
    crawl_hint: >
      Extract the summary of TCJA provisions that affect C-corporations:
      21% flat rate, §163(j), §174, bonus depreciation, §199A (pass-through),
      and any sunset provisions.

  # -----------------------------------------------------------------------
  # South Carolina — Corporate income tax
