    crawl_hint: >
      Extract VDP eligibility rules, lookback period, penalty waiver terms,
      and contact information.

  - name: "SCDOR Penalty Waiver — SC Revenue Procedure 95-2"
    jurisdiction: SC
    topic: sc_penalty_waiver
    tax_year: null
    base_url: https://dor.sc.gov/administrative-interest-penalties-waivers-penalty-waiver-0
    refresh_days: 180
    crawl_hint: >
      Extract the reasonable-cause criteria for penalty waiver under
      SC Revenue Procedure 95-2 and SC Code §12-54-160.

  # -----------------------------------------------------------------------
  # IRS — Officer compensation / reasonable compensation
  # -----------------------------------------------------------------------
  - name: "IRS Form 1125-E instructions"
    jurisdiction: US
    topic: form_1125e
    tax_year: null
    base_url: https://www.irs.gov/pub/irs-pdf/i1125e.pdf
    refresh_days: 180
    crawl_hint: >
      PDF — extract instructions for reporting officer compensation on Form
      1125-E, the $1M compensation deduction limit (§162(m)), and the
      definition of 'officer' under IRC §3401(c).

  - name: "IRS reasonable compensation guidance"
    jurisdiction: US
    topic: reasonable_compensation
    tax_year: null
    # rotated 2026-05-29: old URL
    # https://www.irs.gov/businesses/small-businesses-self-employed/reasonable-compensation
