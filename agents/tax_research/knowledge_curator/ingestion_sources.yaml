    crawl_hint: >
      Extract the SC corporate income tax rate (currently 5% per SC Code
      §12-6-530), apportionment rules, IRC conformity date, and any
      SC-specific modifications (additions/subtractions) to federal taxable income.

  - name: "SCDOR SC1120 instructions"
    jurisdiction: SC
    topic: sc1120_instructions
    tax_year: null
    base_url: https://dor.sc.gov/forms-site/forms/sc1120i.pdf
    refresh_days: 60
    crawl_hint: >
      PDF — extract line-by-line instructions, SC modifications,
      apportionment factor rules, and filing deadlines.

  - name: "SCDOR IRC Conformity Guide 2021–2024"
    jurisdiction: SC
    topic: sc_irc_conformity
    tax_year: null
    base_url: https://dor.sc.gov/sites/dor/files/Documents/Policy%20Manuals/Conformity%20Guide%2021-23.pdf
    refresh_days: 90
    crawl_hint: >
      PDF — extract SC IRC conformity date and the list of federal provisions
      that SC has NOT adopted (§163(j) limitation, bonus depreciation
      phase-down, §199A, GILTI, etc.).

  - name: "SCDOR Voluntary Disclosure Program"
    jurisdiction: SC
    topic: sc_voluntary_disclosure
    tax_year: null
    base_url: https://dor.sc.gov/businesses/nexus/voluntary-disclosure
