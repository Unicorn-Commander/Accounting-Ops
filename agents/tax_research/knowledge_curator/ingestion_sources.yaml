    crawl_hint: >
      Extract the multi-factor test for reasonable compensation (training,
      duties, time, dividend history, comparable wages, etc.), audit risk
      indicators, and the IRS LB&I job aid reference for valuation professionals.

  # -----------------------------------------------------------------------
  # IRS — Net Operating Loss (§172)
  # -----------------------------------------------------------------------
  - name: "IRS Instructions for Form 172 — Net Operating Losses"
    jurisdiction: US
    topic: nol_172
    tax_year: null
    # rotated 2026-05-29: old URL
    # https://www.irs.gov/pub/irs-pdf/p536.pdf
    # IRS retired Publication 536 after TY 2023; NOL guidance is now consolidated
    # into the Instructions for Form 172, which is the canonical successor.
    base_url: https://www.irs.gov/pub/irs-pdf/i172.pdf
    refresh_days: 180
    crawl_hint: >
      PDF (Instructions for Form 172) — extract the post-TCJA 80%-of-taxable-income
      limitation on NOL deductions, indefinite carryforward rules, and the
      interaction with §465 at-risk rules. Note that Pub 536 is no longer revised
      and Form 172 instructions are the authoritative source going forward.

  # -----------------------------------------------------------------------
  # IRS — Wayfair / economic nexus (state sales tax)
  # -----------------------------------------------------------------------
  - name: "IRS Sales Tax Nexus — Wayfair summary"
    jurisdiction: US
    topic: wayfair_nexus
    tax_year: null
    # TODO 2026-05-29: needs-manual-review — no canonical federal replacement.
    # Old URL https://www.irs.gov/businesses/small-businesses-self-employed/sales-and-use-taxes-wayfair
    # returns 404. State sales tax / Wayfair economic nexus is a state-law
    # topic and irs.gov no longer maintains a dedicated explainer. Candidate
    # successors that are NOT yet wired in because they're paywalled to our
    # User-Agent (HTTP 403) or non-canonical:
    #   - https://www.congress.gov/crs-product/IF11832 (CRS report — best
    #     federal source but congress.gov returns 403 to non-browser clients)
    #   - https://taxfoundation.org/taxedu/glossary/south-dakota-v-wayfair/
    #     (think-tank, not government — skip per policy)
    # For now leave this entry pointed at the 404 URL so the curator continues
    # to flag it as fetch-error; the SC entry below already covers the practical
    # nexus threshold used by Accounting-Ops customers.
    paywalled: true   # treat as skip-don't-ingest until a canonical URL exists
    base_url: https://www.irs.gov/businesses/small-businesses-self-employed/sales-and-use-taxes-wayfair
    refresh_days: 90
    crawl_hint: >
      Summarize the South Dakota v. Wayfair threshold ($100K or 200 transactions)
      and note that states vary.  Cross-reference SC nexus threshold.

  - name: "SCDOR Sales Tax Nexus — SC economic nexus"
    jurisdiction: SC
    topic: sc_sales_tax_nexus
    tax_year: null
    base_url: https://dor.sc.gov/businesses/nexus
    refresh_days: 60
    crawl_hint: >
      Extract SC economic nexus threshold for sales tax (currently $100K
      in gross receipts or 200 transactions in prior or current calendar year).
