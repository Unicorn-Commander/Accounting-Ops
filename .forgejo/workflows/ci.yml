name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # ---------------------------------------------------------------------------
  # Unit / smoke tier — no docker needed. Lint + every test that runs without a
  # stack. The lint step is blocking and runs first, so it has to stay clean or
  # nothing below it executes.
  # ---------------------------------------------------------------------------
  unit:
    # The fleet's only Forgejo runner (uc-forgejo-runner on bigboy) advertises
    # ubuntu-latest and ubuntu-22.04. It does NOT advertise "docker", so a job
    # asking for that label is never picked up — it queues indefinitely and the
    # repo looks like it has CI when it has none. Sibling repos that do run
    # (accounting-ops-simplefin-mcp) use ubuntu-latest; match them.
    runs-on: ubuntu-latest
    # Deliberately NO `container:` override. python:3.12-slim ships neither git
    # nor node, and actions/checkout is a node action that shells out to git —
    # so the job died three seconds in, before a single step of our own ran.
    # The runner's default image (catthehacker/ubuntu:act-22.04) has both, and
    # is what the sibling repos that do run on this runner use. It carries
    # Python 3.10, hence setup-python below: this package requires >= 3.12.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Fetch IRS form PDFs
        # The form-fill tests assert against the real IRS PDFs. Those are
        # gitignored on purpose (.gitignore:32 — "downloaded by
        # scripts/download_irs_forms.sh"), so a fresh checkout has none and
        # five test modules fail rather than skip: they are meant to run for
        # real, not to quietly pass on an absent file. Downloading them here is
        # the workflow the script exists for.
        #
        # curl and ca-certificates are already in the runner image. This does
        # put irs.gov on the critical path of every run. That is the
        # deliberate trade: a form whose field map has drifted is the failure
        # this suite exists to catch, and skipping on a missing file would hide
        # exactly that. `|| true` is NOT wanted here — if the forms cannot be
        # fetched, the tests below are not meaningful and should say so.
        run: bash scripts/download_irs_forms.sh

      - name: Ruff lint (test + CI surface — blocking)
        run: ruff check tests scripts

      - name: Ruff lint (app — informational, non-blocking)
        # The app/ package carries some pre-existing lint debt (unused imports,
        # import ordering) owned by the feature tracks. Surface it without
        # gating CI so this test foundation stays green on day one.
        run: ruff check app || true

      - name: Test suite (no stack)
        # No explicit path: `testpaths = ["tests"]` in pyproject.toml decides
        # the set, so a tier added under tests/ is gated the day it lands
        # instead of waiting for someone to widen this line. tests/smoke was
        # the only path here before, which left tests/unit and the ~17
        # stack-free tests under tests/integration gating nothing.
        #
        # The stack-bound integration tests self-skip when no compose stack is
        # reachable, and importing them here is the same syntax/import check
        # the old --collect-only step gave us.
        run: pytest -v

  # ---------------------------------------------------------------------------
  # Integration tier — builds the images and runs the real pipeline against a
  # live postgres + garage + app stack stood up with docker compose.
  #
  # Requires the Forgejo runner to expose a Docker daemon. Two supported setups
  # (see docs/admin/actions/docker-access):
  #   * DinD: the runner config sets DOCKER_HOST to the dind service.
  #   * socket mount: container.docker_host = 'automount'.
  # The published test ports (app 58000 / pg 55432, see docker-compose.itest.yml)
  # are reached over 127.0.0.1 — this assumes the job container shares the
  # daemon's loopback (true for socket-mount and for DinD that shares the
  # network namespace). If your runner isolates them, point ACCTOPS_TEST_BASE_URL
  # / ACCTOPS_TEST_DSN at the dind host instead.
  # ---------------------------------------------------------------------------
  integration:
    # Same label constraint as the unit job. This one also needs the host
    # docker socket, which uc-forgejo-runner does mount — but note it shares
    # bigboy with the inference stack, so this job stands a compose stack up on
    # a box that is usually busy. That is the other reason it is gated to main
    # and pull requests below rather than every branch push.
    runs-on: ubuntu-latest
    # OFF until two things are true, hence the repo-variable switch:
    #
    #  1. The runner exposes a Docker daemon to JOB containers. uc-forgejo-runner
    #     mounts /var/run/docker.sock into ITSELF, which is not the same thing —
    #     this job's first docker call fails with "Cannot connect to the Docker
    #     daemon". Fixing it means setting container.docker_host = 'automount'
    #     (or a DinD service) in the runner's own config, which is shared with
    #     every other repo on that runner and is therefore not a change this
    #     workflow gets to make for itself.
    #  2. Someone has decided this box should stand compose stacks up at all —
    #     it is bigboy, which also runs the inference stack.
    #
    # Until then the job would fail on every main push for a reason that has
    # nothing to do with the commit, and a permanently-red pipeline is one
    # people stop reading. Set the repo variable ACCTOPS_INTEGRATION_CI to
    # 'true' once (1) is done to turn it on.
    if: >-
      vars.ACCTOPS_INTEGRATION_CI == 'true' &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    # Use a docker-capable image. The CLI + compose plugin are installed in the
    # first step if the base image doesn't ship them.
    container:
      image: docker:27-cli
    steps:
      - name: Install toolchain (git, python, compose plugin)
        run: |
          apk add --no-cache git nodejs python3 py3-pip make docker-cli-compose bash
          python3 --version
          docker version
          docker compose version

      - uses: actions/checkout@v4

      - name: Wait for Docker daemon
        run: |
          for i in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then echo "docker up"; break; fi
            echo "waiting for docker daemon ($i)"; sleep 2
          done
          docker info >/dev/null

      - name: Install python deps (host side, for pytest)
        run: |
          python3 -m pip install --break-system-packages --upgrade pip
          python3 -m pip install --break-system-packages -e ".[dev]"

      - name: Stand up stack + provision
        run: python3 scripts/integration_env.py up

      - name: Run integration + safety-invariant tests
        # Scoped to tests/integration/test_db_rls_roles.py (the RLS/roles
        # suite from PR #27 — 16 tests) rather than the whole tests/integration
        # directory. This is the FIRST time this integration tier has ever run
        # against a live stack (the F6 lane's own report: "no Docker/Postgres
        # stack was available locally"), and a first real run of the OTHER
        # ~150 tests under tests/integration surfaced 21 pre-existing failures
        # across 7 unrelated files (PAT auth, COA entity scope, H2
        # service-token scope, data rights export, document upload, approval
        # recommendations, tax review queue) — none touch RLS/roles, none
        # caused by this CI-plumbing change, all confirmed by running them
        # locally against this same bind-free stack before this PR. Fixing
        # those is real product work across several subsystems, not a CI
        # fix, and letting the gate we just turned on go permanently red on
        # day one trains people to stop reading it (see fleet memory
        # reference_forgejo_actions_ci.md: "never use a never-green job as a
        # merge gate"). Tracked as a follow-up; widen this back to
        # `tests/integration` once that's triaged.
        #
        # Runs INSIDE the app container (scripts/integration_env.py test),
        # not out here. Reachability alone wasn't enough: the job container
        # CAN reach the stack's published ports under dind (confirmed by a
        # probe), but every test that does a real HTTP POST/read through the
        # app — not just a straight-to-Postgres query — hung for its full
        # 30s client timeout and failed with httpcore.ReadTimeout, on the
        # multi-hop NAT path back from dind to a job container on a
        # different per-workflow bridge network (run 101, task 3735: 7
        # failed, all and only the HTTP-client tests; the 9 DB-only tests
        # passed). Running pytest inside `app` reaches Postgres at its
        # service name and itself at 127.0.0.1 — the same one-network path
        # the app's own code already uses every request, no NAT hop at all.
        run: |
          python3 scripts/integration_env.py test -- \
            -m integration tests/integration/test_db_rls_roles.py -v -rs --junitxml=itest-results.xml
          # A skipped module passes green. This suite skips itself when the stack
          # or the runtime role is missing, which is exactly how CI ran 0 RLS
          # tests for months. Fail unless every test executed and passed.
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("itest-results.xml").getroot()
          suite = root if root.tag == "testsuite" else root.find("testsuite")
          tests, skipped = int(suite.get("tests")), int(suite.get("skipped"))
          failures, errors = int(suite.get("failures")), int(suite.get("errors"))
          print(f"RLS integration: tests={tests} skipped={skipped} failures={failures} errors={errors}")
          assert tests >= 16 and skipped == 0 and failures == 0 and errors == 0, "RLS integration tests did not all execute and pass"
          PY

      - name: Dump app logs on failure
        if: failure()
        run: |
          COMPOSE="docker compose -p acctops_itest -f docker-compose.yml -f docker-compose.itest.yml --env-file .env.integration"
          $COMPOSE logs app postgres garage || true
          # Diagnostic only (does not change what's tested or the guard above).
          # Every HTTP-client test hung for its full client timeout while every
          # DB-only test passed; this answers whether the app's own DB session
          # is stuck waiting on a lock (someone else holding it, or blocked on
          # its own idle-in-transaction connection) versus never reaching
          # Postgres at all, without guessing again.
          echo "=== pg_stat_activity (non-idle) ==="
          PGPW="$(grep '^POSTGRES_PASSWORD=' .env.integration | cut -d= -f2-)"
          $COMPOSE exec -T -e PGPASSWORD="$PGPW" postgres \
            psql -U accounting_ops -d accounting_ops -c \
            "SELECT pid, usename, state, wait_event_type, wait_event, \
                    now() - query_start AS duration, left(query, 200) AS query \
             FROM pg_stat_activity WHERE state IS DISTINCT FROM 'idle' \
             ORDER BY query_start;" || true
          echo "=== pg_locks (ungranted) ==="
          $COMPOSE exec -T -e PGPASSWORD="$PGPW" postgres \
            psql -U accounting_ops -d accounting_ops -c \
            "SELECT pid, relation::regclass, mode, granted FROM pg_locks \
             WHERE NOT granted;" || true

      - name: Tear down
        if: always()
        run: python3 scripts/integration_env.py down || true
