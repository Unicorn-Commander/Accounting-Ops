name: ci

# Publish gates for the open-core Community Edition. Every push and PR must pass
# secret scanning; every PR commit must carry a DCO sign-off. These mirror the
# gates the snapshot was hardened against before its first push.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Secret scan (gitleaks + trufflehog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks (config-gated, redacted)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --config /repo/.gitleaks.toml --no-banner --redact

      - name: trufflehog (verified secrets only)
        run: |
          docker run --rm -v "$PWD:/repo" trufflesecurity/trufflehog:latest \
            --no-update filesystem /repo --only-verified --fail

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Every PR commit must be Signed-off-by
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          missing=0
          for c in $(git rev-list "$base..$head"); do
            if ! git log -1 --format=%B "$c" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::commit ${c:0:12} is missing a Signed-off-by line"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "All commits must be signed off: git commit -s (see CONTRIBUTING.md)."
            exit 1
          fi
          echo "All PR commits carry a DCO sign-off."
