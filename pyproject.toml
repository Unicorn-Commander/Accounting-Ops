[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "accounting-ops"
version = "0.8.0"
description = "Agent-first, MCP-first financial operations platform for Magic Unicorn Inc."
requires-python = ">=3.12"
dependencies = [
  "a2a-sdk>=0.3.0",
  "alembic>=1.13.3",
  "asyncpg>=0.29.0",
  "cryptography>=43.0.0",
  "psycopg2-binary>=2.9.9",
  "falkordb>=1.0.0",
  # CAPPED 2026-08-11: falkordb 1.6.2 (the latest) declares only "redis>=7.1.0",
  # but redis 8.1.0 puts `himport_registry` in the async connection kwargs and
  # falkordb's Is_Cluster() replays those into the SYNC Redis(), which rejects
  # it: "Redis.__init__() got an unexpected keyword argument 'himport_registry'".
  # Every graph projection then failed. It is fire-and-forget, so this surfaced
  # only as a WARNING and the decision graph silently stopped being populated
  # while Postgres (authoritative) stayed correct. Lift the cap once falkordb
  # ships a release that tolerates redis >= 8.1.
  "redis>=7.1.0,<8.1",
  "fastapi>=0.115.0",
  "httpx>=0.27.2",
  "mcp>=1.2.0,<2",  # <2: 2.0.0 removed mcp.server.fastmcp (see tax-agents note)
  # Required for FastAPI multipart/form-data uploads (document-upload endpoint).
  # Already pulled in transitively, but pinned explicitly so the production
  # image (pip install from pyproject) is guaranteed to have it.
  "python-multipart>=0.0.9",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-exporter-otlp>=1.27.0",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
  "opentelemetry-sdk>=1.27.0",
  "pydantic>=2.9.0",
  "python-jose[cryptography]>=3.3.0",
  "sqlalchemy[asyncio]>=2.0.35",
  "uvicorn[standard]>=0.30.6",
  # Specialist draft PDF rendering (handoff package)
  "weasyprint>=62.0",
  "markdown>=3.5",
  # IRS form pre-fill: fill official PDF form fields + overlay DRAFT watermark
  "pypdf>=4.3.0",
  "PyPDFForm>=1.4.0",
  "reportlab>=4.2.0",
  # Rasterize scanned tax-document PDFs to page images for the vision VLM
  # (app/categorization/tax_doc_vlm.py). pypdf can't render; pymupdf can.
  "pymupdf>=1.24.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.3",
  "pytest-asyncio>=0.24.0",
  "ruff>=0.6.9",
]
# Cross-replica rate limiting (app/rate_limit.py). NOT needed for the default
# deployment: the limiter's in-process backend is exact while `app` runs a
# single replica, and there is no Redis/valkey in the compose stack. Install
# this extra and set AO_RATE_LIMIT_REDIS_URL only if the app is scaled out, so
# the replicas share one ceiling instead of each enforcing its own.
ratelimit = [
  # Same cap as the main dependency — see the falkordb/redis note above.
  "redis>=5.0.0,<8.1",
]
# Tax-agent specialist runner dependencies.
# Not in main deps — only needed for agents/tax_specialists/*/run_specialist.py.
# Install with: uv pip install accounting-ops[tax-agents]
#
# anthropic  — Anthropic SDK with native MCP client integration (beta)
# openai     — OpenAI-compatible client for local endpoints (e.g. llama-server)
# mcp[cli]   — MCP Python SDK; the [cli] extra includes the client transport
#              (streamable_http) needed for the manual tool-call loop in the
#              openai backend.  The main deps already pin mcp>=1.2.0 for the
#              server side; the [cli] extra just adds client-transport extras.
tax-agents = [
  "anthropic>=0.44.0",
  "openai>=1.40.0",
  # PIN: mcp 2.0.0 removed mcp.server.fastmcp, which mcp_server.py:90
  # imports. With an unpinned >=0.6.0 the next rebuild of this image
  # silently produced an app that crash-loops on boot with
  # "Install the PyPI 'mcp' package". Verified 2026-08-11.
  "mcp[cli]>=1.0,<2",
]

[tool.setuptools.packages.find]
include = ["app*", "agents*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
# pytest-asyncio in auto mode: async test functions need no per-test decorator,
# but we keep explicit @pytest.mark.asyncio for clarity in the integration tier.
asyncio_mode = "auto"
# Session-scoped loop so the session-scoped asyncpg pool + seeding fixtures
# share ONE event loop with the per-test coroutines. (A session-scoped pool on
# a function-scoped loop raises "Future attached to a different loop".)
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
markers = [
  "integration: exercises a live docker-compose stack (postgres + garage + app). Skips if the stack isn't reachable.",
]
